<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verity Merge</title>
  <script>
    var bridgeScript = document.createElement('script');
    bridgeScript.src = ['https:/', 'unpkg.com', '@vkontakte', 'vk-bridge', 'dist', 'browser.min.js'].join('/');
    bridgeScript.onload = function() {
      vkBridge.send('VKWebAppInit');
    };
    document.head.appendChild(bridgeScript);
  </script>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #1a1a1a; }
    #unity-container, #unity-canvas { width: 100%; height: 100%; display: block; }
    #loading-cover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; background: #1a1a1a; }
    #unity-progress-bar-empty { width: 250px; height: 14px; border: 1px solid #fff; border-radius: 7px; padding: 2px; }
    #unity-progress-bar-full { width: 0%; height: 100%; background: #4caf50; border-radius: 5px; transition: width 0.2s; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loading-cover">
    <div id="unity-progress-bar-empty">
      <div id="unity-progress-bar-full"></div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build 1.0 VK.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build 1.0 VK.data",
      frameworkUrl: buildUrl + "/Build 1.0 VK.framework.js",
      codeUrl: buildUrl + "/Build 1.0 VK.wasm",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Verity Merge",
      productVersion: "1.0",
    };

    var canvas = document.querySelector("#unity-canvas");
    var loadingCover = document.querySelector("#loading-cover");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
