<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Verity Merge</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com"></script>
  <script>
    window.addEventListener('load', function() {
      if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit');
      }
    });
  </script>
</head>
<body class="dark">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loading-cover">
    <div id="unity-loading-bar">
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
    </div>
  </div>
  <script>
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/Build_1.0_VK.loader.js";
    var config = {
      dataUrl: buildUrl + "/Build_1.0_VK.data.br",
      frameworkUrl: buildUrl + "/Build_1.0_VK.framework.js.br",
      codeUrl: buildUrl + "/Build_1.0_VK.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Verity Merge",
      productVersion: "1.0",
    };

    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingCover = document.querySelector("#loading-cover");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");

    canvas.style.width = "100%";
    canvas.style.height = "100%";
    loadingCover.style.display = "";

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = 100 * progress + "%";
      }).then((unityInstance) => {
        window.unityInstance = unityInstance;
        loadingCover.style.display = "none";
      }).catch((message) => {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
